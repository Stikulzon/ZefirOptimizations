name: Build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Minecraft 1.21.1 compiles with a Java 21 toolchain, 26.2 with Java 25.
      # The last version listed is the one Gradle itself runs on.
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew spotlessCheck build --max-workers=2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test reports
          path: versions/*/build/reports/tests/
          if-no-files-found: ignore
