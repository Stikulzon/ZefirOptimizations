name: Release Mod

on:
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Minecraft 1.21.1 compiles with a Java 21 toolchain, 26.2 with Java 25.
      # The last version listed is the one Gradle itself runs on.
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --max-workers=2

      - name: Collect release jars
        run: |
          mkdir -p release
          find versions/*/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
